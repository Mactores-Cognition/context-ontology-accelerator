# Static SPA server. Replaces the CloudFront distribution: SPA fallback stands
# in for the 403/404 -> /index.html error responses, and the snippets carry the
# headers the ResponseHeadersPolicy used to set.

worker_processes auto;
# Non-root cannot write /var/run or /var/cache/nginx.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  tcp_nopush on;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx inherits add_header from a parent ONLY if the current level declares
    # none of its own, so every location below that sets any header must include
    # both snippets or it silently drops the whole security header set.

    # ALB target-group probe.
    location = /health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Per-environment config, written by the entrypoint. Never cache.
    location = /runtime-config.json {
      include /etc/nginx/snippets/security-headers.conf;
      include /etc/nginx/snippets/transport-headers.conf;
      add_header Cache-Control "no-store, max-age=0" always;
    }

    location = /index.html {
      include /etc/nginx/snippets/security-headers.conf;
      include /etc/nginx/snippets/transport-headers.conf;
      add_header Cache-Control "no-store, max-age=0" always;
    }

    # Optional operator-supplied example prompts. 404 is expected and handled.
    location /questions/ {
      include /etc/nginx/snippets/security-headers.conf;
      include /etc/nginx/snippets/transport-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    # Vite emits content-hashed filenames, so these are immutable.
    location /assets/ {
      include /etc/nginx/snippets/security-headers.conf;
      include /etc/nginx/snippets/transport-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      include /etc/nginx/snippets/security-headers.conf;
      include /etc/nginx/snippets/transport-headers.conf;
      try_files $uri /index.html;
    }
  }
}
